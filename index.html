<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>藥用植物學 100 題 · 單選模擬題庫</title>
<style>
:root{
  --bg:#f3f7f1; --card:#ffffff; --ink:#1d2a21; --mute:#667a6c; --line:#dce6d9;
  --brand:#2e7d4f; --brand-d:#1f5c3a; --brand-soft:#e6f3ea;
  --ok:#2e7d4f; --okbg:#e3f4e8; --bad:#c0392b; --badbg:#fcebe8; --star:#e0a100;
  --shadow:0 2px 10px rgba(30,60,40,.08);
}
[data-theme="dark"]{
  --bg:#121a15; --card:#1b261f; --ink:#e6efe8; --mute:#93a89a; --line:#2c3b31;
  --brand:#4fb97b; --brand-d:#7fd3a0; --brand-soft:#21352a;
  --ok:#5ccf8a; --okbg:#1c3626; --bad:#ef7a6c; --badbg:#3b2220; --star:#f0bf3a;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.65}
.wrap{max-width:860px;margin:0 auto;padding:12px 14px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0 4px}
h1{font-size:1.15rem;margin:0;color:var(--brand-d)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.tbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:.85rem}
.tbtn:hover{border-color:var(--brand)}
.tbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;margin:6px 0}
.stats b{font-variant-numeric:tabular-nums}
.s-ok{color:var(--ok)} .s-bad{color:var(--bad)} .s-fav{color:var(--star)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 11px;font-size:.82rem}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-d);font-weight:600}
.sep{flex-basis:100%;height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 16px 14px;margin-top:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--mute);margin-bottom:8px}
.tag{border-radius:6px;padding:1px 8px;font-size:.76rem;border:1px solid var(--line)}
.t-must{background:#fff0e0;color:#b4570a;border-color:#f3cfa5}
[data-theme="dark"] .t-must{background:#3b2a16;color:#f2b36b;border-color:#5c4224}
.t-basic{color:#2e7d4f}.t-mid{color:#a67a00}.t-hard{color:#c0392b}
.spacer{flex:1}
.favbtn{border:none;background:none;font-size:1.4rem;line-height:1;color:var(--mute);padding:0 4px}
.favbtn.on{color:var(--star)}
.qno{font-size:.85rem;color:var(--mute);margin-bottom:2px}
.qtext{font-size:1.08rem;font-weight:600;margin:2px 0 12px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
.opt .k{flex:0 0 1.6em;height:1.6em;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--mute);margin-top:1px}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.exp{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--brand-soft);border-left:4px solid var(--brand);font-size:.95rem}
.exp .res{font-weight:700;margin-bottom:2px}
.exp .res.ok{color:var(--ok)} .exp .res.bad{color:var(--bad)}
.exp .src{margin-top:4px;font-size:.8rem;color:var(--mute)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ghost{border:1px solid var(--line);background:none;color:var(--mute);border-radius:8px;padding:4px 10px;font-size:.82rem}
.ghost:hover{border-color:var(--brand);color:var(--brand-d)}
.pager{display:flex;gap:10px;margin-top:12px}
.pager button{flex:1;padding:10px;border-radius:10px;border:none;font-weight:600;background:var(--brand);color:#fff;font-size:1rem}
.pager button:disabled{opacity:.35;cursor:default}
.pager .prev{background:var(--card);color:var(--brand-d);border:1.5px solid var(--brand)}
.nav{margin-top:16px}
.nav h2{font-size:.95rem;margin:0 0 6px;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.g{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 0;font-size:.8rem;font-variant-numeric:tabular-nums}
.g.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.g.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.g.cur{outline:2px solid var(--brand);outline-offset:1px;font-weight:700}
.legend{display:flex;gap:12px;font-size:.78rem;color:var(--mute);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.legend .l-ok::before{background:var(--okbg);border-color:var(--ok)}
.legend .l-bad::before{background:var(--badbg);border-color:var(--bad)}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#222;color:#fff;border-radius:999px;padding:7px 16px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:.94}
.hint{font-size:.76rem;color:var(--mute);margin-top:14px;text-align:center}
@media(max-width:520px){.qtext{font-size:1rem}.card{padding:13px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌿 藥用植物學 · 單選模擬題庫</h1>
    <div class="tools">
      <button class="tbtn" id="bShuffle">🔀 隨機：關</button>
      <button class="tbtn" id="bReset">🔄 重設</button>
      <button class="tbtn" id="bTheme">🌙 深色</button>
    </div>
  </header>

  <div class="stats">
    <span>答對 <b class="s-ok" id="sOk">0</b></span>
    <span>答錯 <b class="s-bad" id="sBad">0</b></span>
    <span>收藏 <b class="s-fav" id="sFav">0</b></span>
    <span>已作答 <b id="sDone">0</b> / <b id="sAll">0</b></span>
  </div>
  <div class="bar"><i id="barFill"></i></div>

  <div class="filters" id="filters"></div>

  <div id="main"></div>

  <div class="nav" id="nav">
    <h2>題號導覽 <span id="navCount"></span></h2>
    <div class="grid" id="grid"></div>
    <div class="legend"><span>未答</span><span class="l-ok">答對</span><span class="l-bad">答錯</span></div>
  </div>
  <div class="hint">快捷鍵：1–4 或 A–D 作答　←／→ 換題　F 收藏</div>
</div>
<div class="toast" id="toast"></div>

<script src="questions.js"></script>
<script>
(function(){
  var KEY = "botany-quiz-v1";
  var DIFF = {basic:"基礎", mid:"進階", hard:"挑戰"};
  var LET = ["A","B","C","D"];
  var byId = {};
  questions.forEach(function(q){ byId[q.id] = q; });
  var chapters = [];
  questions.forEach(function(q){ if(chapters.indexOf(q.chapter) < 0) chapters.push(q.chapter); });

  // ---- 狀態（存於 localStorage）----
  var st = {ans:{}, fav:[], theme:"light", shuffle:false};
  try { var s = JSON.parse(localStorage.getItem(KEY) || "{}"); for(var k in s) st[k] = s[k]; } catch(e){}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }

  var filt = {type:"all", val:null};
  var list = [];   // 目前題單（題目 id 陣列）
  var idx = 0;

  function $(id){ return document.getElementById(id); }
  function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove("show");},1400); }
  function isWrong(id){ return st.ans[id] !== undefined && st.ans[id] !== byId[id].answer; }
  function isFav(id){ return st.fav.indexOf(id) >= 0; }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  function buildList(keepId){
    var a = questions.filter(function(q){
      switch(filt.type){
        case "must": return q.must;
        case "diff": return q.difficulty === filt.val;
        case "chap": return q.chapter === filt.val;
        case "wrong": return isWrong(q.id);
        case "fav": return isFav(q.id);
        default: return true;
      }
    }).map(function(q){ return q.id; });
    if(st.shuffle) shuffle(a);
    list = a;
    idx = 0;
    if(keepId){ var p = list.indexOf(keepId); if(p >= 0) idx = p; }
  }

  // ---- 篩選列 ----
  function renderFilters(){
    var wrongN = questions.filter(function(q){ return isWrong(q.id); }).length;
    var chips = [
      {t:"all", l:"全部 "+questions.length+" 題"},
      {t:"must", l:"🔥 必考重點 ("+questions.filter(function(q){return q.must;}).length+")"},
      {t:"diff", v:"basic", l:"🟢 基礎 ("+cnt("basic")+")"},
      {t:"diff", v:"mid", l:"🟡 進階 ("+cnt("mid")+")"},
      {t:"diff", v:"hard", l:"🔴 挑戰 ("+cnt("hard")+")"},
      {t:"wrong", l:"錯題重練 ("+wrongN+")"},
      {t:"fav", l:"⭐ 收藏題 ("+st.fav.length+")"},
      "sep"
    ];
    chapters.forEach(function(c){
      chips.push({t:"chap", v:c, l:c+" ("+questions.filter(function(q){return q.chapter===c;}).length+")"});
    });
    var h = "";
    chips.forEach(function(c, i){
      if(c === "sep"){ h += '<span class="sep"></span>'; return; }
      var on = filt.type === c.t && (c.v === undefined || filt.val === c.v);
      h += '<button class="chip'+(on?" on":"")+'" data-i="'+i+'">'+esc(c.l)+'</button>';
    });
    $("filters").innerHTML = h;
    $("filters").onclick = function(e){
      var b = e.target.closest(".chip"); if(!b) return;
      var c = chips[+b.getAttribute("data-i")];
      filt = {type:c.t, val:c.v === undefined ? null : c.v};
      buildList(); render();
    };
  }
  function cnt(d){ return questions.filter(function(q){ return q.difficulty === d; }).length; }

  // ---- 主畫面 ----
  function render(){
    var ok=0, bad=0;
    questions.forEach(function(q){ if(st.ans[q.id] !== undefined){ if(st.ans[q.id] === q.answer) ok++; else bad++; } });
    $("sOk").textContent = ok; $("sBad").textContent = bad; $("sFav").textContent = st.fav.length;
    $("sDone").textContent = ok + bad; $("sAll").textContent = questions.length;
    $("barFill").style.width = ((ok+bad)/questions.length*100) + "%";
    renderFilters();

    var main = $("main");
    if(!list.length){
      var msg = filt.type === "wrong" ? "目前沒有錯題 🎉" : filt.type === "fav" ? "還沒有收藏的題目，點題目右上角的 ☆ 就能收藏" : "沒有符合的題目";
      main.innerHTML = '<div class="card empty">'+msg+'</div>';
      $("grid").innerHTML = ""; $("navCount").textContent = "(0)";
      return;
    }
    var q = byId[list[idx]];
    var chosen = st.ans[q.id];
    var done = chosen !== undefined;
    var h = '<div class="card">';
    h += '<div class="meta"><span>'+esc(q.chapter)+'</span>';
    if(q.must) h += '<span class="tag t-must">🔥 期中必考</span>';
    h += '<span class="tag t-'+q.difficulty+'">'+DIFF[q.difficulty]+'</span><span class="spacer"></span>';
    h += '<button class="favbtn'+(isFav(q.id)?" on":"")+'" id="favBtn" title="收藏（F）">'+(isFav(q.id)?"★":"☆")+'</button></div>';
    h += '<div class="qno">第 '+(idx+1)+' 題 / 共 '+list.length+' 題　(題號 '+q.id+')</div>';
    h += '<div class="qtext">'+esc(q.question)+'</div><div class="opts">';
    q.options.forEach(function(o, i){
      var cls = "opt";
      if(done){ if(i === q.answer) cls += " ok"; else if(i === chosen) cls += " bad"; }
      h += '<button class="'+cls+'" data-i="'+i+'"'+(done?" disabled":"")+'><span class="k">'+LET[i]+'</span><span>'+esc(o)+'</span></button>';
    });
    h += '</div>';
    if(done){
      var right = chosen === q.answer;
      h += '<div class="exp"><div class="res '+(right?"ok":"bad")+'">'+(right?"✔ 答對了":"✘ 答錯了，正確答案是 "+LET[q.answer])+'</div>'+esc(q.explanation)+'<div class="src">📖 講義來源：'+esc(q.source)+'</div></div>';
    }
    h += '<div class="actions">';
    if(done) h += '<button class="ghost" id="redoBtn">↺ 重做本題</button>';
    h += '<button class="ghost" id="copyBtn">📋 複製題目</button></div>';
    h += '<div class="pager"><button class="prev" id="prevBtn"'+(idx===0?" disabled":"")+'>⬅ 上一題</button><button id="nextBtn"'+(idx===list.length-1?" disabled":"")+'>下一題 ➡</button></div>';
    h += '</div>';
    main.innerHTML = h;

    main.querySelector(".opts").onclick = function(e){
      var b = e.target.closest(".opt"); if(!b || b.disabled) return;
      answer(+b.getAttribute("data-i"));
    };
    $("favBtn").onclick = toggleFav;
    $("prevBtn").onclick = function(){ go(idx-1); };
    $("nextBtn").onclick = function(){ go(idx+1); };
    $("copyBtn").onclick = copyQ;
    if($("redoBtn")) $("redoBtn").onclick = function(){ delete st.ans[q.id]; save(); render(); };

    // 題號導覽
    var g = "";
    list.forEach(function(id, i){
      var c = "g";
      if(st.ans[id] !== undefined) c += st.ans[id] === byId[id].answer ? " ok" : " bad";
      if(i === idx) c += " cur";
      g += '<button class="'+c+'" data-i="'+i+'">'+id+'</button>';
    });
    $("grid").innerHTML = g;
    $("navCount").textContent = "(" + list.length + ")";
    $("grid").onclick = function(e){ var b = e.target.closest(".g"); if(b) go(+b.getAttribute("data-i")); };
  }

  function go(i){ if(i < 0 || i >= list.length) return; idx = i; render(); window.scrollTo({top:0, behavior:"smooth"}); }
  function answer(i){
    var q = byId[list[idx]];
    if(st.ans[q.id] !== undefined) return;
    st.ans[q.id] = i; save(); render();
  }
  function toggleFav(){
    var id = list[idx]; if(id === undefined) return;
    var p = st.fav.indexOf(id);
    if(p >= 0){ st.fav.splice(p,1); toast("已取消收藏"); } else { st.fav.push(id); toast("已加入收藏 ⭐"); }
    save(); render();
  }
  function copyQ(){
    var q = byId[list[idx]];
    var t = "【" + q.chapter + "】第 " + q.id + " 題\n" + q.question + "\n" +
      q.options.map(function(o,i){ return LET[i] + ". " + o; }).join("\n") +
      "\n答案：" + LET[q.answer] + "\n解析：" + q.explanation + "\n來源：" + q.source;
    function done(){ toast("已複製至剪貼簿！"); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, function(){ fallback(t); }); } else fallback(t);
    function fallback(s){ var ta=document.createElement("textarea"); ta.value=s; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); done();}catch(e){toast("複製失敗");} document.body.removeChild(ta); }
  }

  // ---- 工具列 ----
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", st.theme);
    $("bTheme").textContent = st.theme === "dark" ? "☀️ 淺色" : "🌙 深色";
  }
  function applyShuffleBtn(){
    $("bShuffle").textContent = "🔀 隨機：" + (st.shuffle ? "開" : "關");
    $("bShuffle").classList.toggle("on", st.shuffle);
  }
  $("bTheme").onclick = function(){ st.theme = st.theme === "dark" ? "light" : "dark"; save(); applyTheme(); };
  $("bShuffle").onclick = function(){ st.shuffle = !st.shuffle; save(); applyShuffleBtn(); buildList(); render(); };
  $("bReset").onclick = function(){
    if(confirm("確定要清除所有作答紀錄嗎？（收藏會保留）")){ st.ans = {}; save(); buildList(); render(); toast("已重設作答紀錄"); }
  };

  document.addEventListener("keydown", function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if(k === "arrowleft") go(idx-1);
    else if(k === "arrowright") go(idx+1);
    else if(k === "f") toggleFav();
    else {
      var n = "1234".indexOf(k); if(n < 0) n = "abcd".indexOf(k);
      if(n >= 0 && list.length) answer(n);
    }
  });

  applyTheme(); applyShuffleBtn(); buildList(); render();
})();
</script>
</body>
</html>
